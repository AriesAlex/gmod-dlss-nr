rtx.neuralRendering.intensity = 2.0
rtx.neuralRendering.localToneStrength = 1.0
rtx.neuralRendering.localStructureStrength = 1.0
rtx.neuralRendering.skinStructureStrength = 1.0
rtx.neuralRendering.style = 1
rtx.neuralRendering.useAutoMask = True
rtx.neuralRendering.paperWhiteScale = 1.0
rtx.neuralRendering.transferStrength = 1.0
rtx.neuralRendering.colorStrength = 1.0
